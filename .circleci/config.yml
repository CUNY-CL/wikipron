version: 2.1

orbs:
  win: circleci/windows@5.1.1


jobs:
  pre-build:
    description: A check that needs to be done on only one supported Python version
    parameters:
      command-run:
        type: string
    docker:
      # Use the latest Python 3.x image from CircleCI that WikiPron supports.
      # See: https://circleci.com/developer/images/image/cimg/python
      # (cimg/python ships uv pre-installed.)
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Create virtual environment and install dev dependencies
          # Install the dev dependencies (but not the wikipron package itself)
          # into a uv-managed venv. Persist activation to later steps via
          # $BASH_ENV so the installed tools (flake8, black, ...) are on PATH
          # -- CircleCI sources $BASH_ENV before every step.
          command: |
              uv venv
              echo "source $PWD/.venv/bin/activate" >> "$BASH_ENV"
              uv pip install -r pyproject.toml --group dev
              uv pip list -v
      - run:
          command: << parameters.command-run >>

  build-python:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Build source distribution and install package from it
          # Build the sdist+wheel, then install the wheel (not the source) into
          # a uv-managed venv so the tests run against the built artifact.
          # Persist activation to later steps via $BASH_ENV -- CircleCI sources
          # $BASH_ENV before every step.
          command: |
              uv venv
              echo "source $PWD/.venv/bin/activate" >> "$BASH_ENV"
              uv build
              uv pip install dist/`ls dist/ | grep .whl`
              uv pip install pytest
      - run:
          name: Show installed Python packages
          command: uv pip list -v
      - run:
          name: Run Python tests
          command: |
              pytest -vv tests --junitxml /tmp/testxml/report.xml
      - store_test_results:
          path: /tmp/testxml/

  build-python-win:
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout
      - run: systeminfo
      - run:
          name: Run tests on Windows
          shell: bash.exe
          command: |
            # The Windows image has Python + pip but not uv. pip's --group
            # (PEP 735) needs pip >= 25.1, so upgrade pip first.
            python --version && \
            python -m pip install --upgrade pip && \
            pip --version && \
            pip install -e . --group dev && \
            pip list && \
            pytest -vv tests

workflows:
  version: 2
  build-and-test:
    jobs:
      - pre-build:
          name: flake8
          command-run: flake8 --extend-ignore E203 data src tests
      - pre-build:
          name: black
          command-run: black --line-length 79 --check data src tests
      - pre-build:
          name: mypy
          command-run: mypy src tests
      - pre-build:
          name: twine
          command-run: |
            uv build && \
            twine check dist/`ls dist/ | grep .tar.gz` && \
            twine check dist/`ls dist/ | grep .whl`
      - build-python:
          requires:
            - flake8
            - black
            - mypy
            - twine
          matrix:
            parameters:
              python-version: ["3.11", "3.12", "3.13", "3.14"]
      - build-python-win:
          requires:
            - flake8
            - black
            - mypy
            - twine
